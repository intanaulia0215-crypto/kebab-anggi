<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            padding-bottom: 40px;
        }
        header {
            background: linear-gradient(135deg, #1e1e1e, #3a3a3a);
            color: #fff;
            text-align: center;
            padding: 30px 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        header h1 {
            color: #ffcc00;
            font-size: 28px;
            margin-bottom: 8px;
        }
        header p {
            font-size: 14px;
            color: #ddd;
        }
        .badge-info {
            display: inline-block;
            background: #e74c3c;
            color: #fff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            margin-top: 10px;
            font-weight: bold;
        }
        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .control-panel {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 25px;
        }
        .wa-selector {
            margin-bottom: 15px;
        }
        .wa-selector label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #444;
        }
        .wa-selector select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
            outline: none;
        }
        .search-box {
            margin-bottom: 15px;
        }
        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
            outline: none;
        }
        .category-buttons {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .btn-cat {
            background: #eee;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }
        .btn-cat.active, .btn-cat:hover {
            background: #ffcc00;
            color: #000;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 18px;
        }
        .menu-card {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #eee;
        }
        .menu-card h3 {
            font-size: 16px;
            color: #222;
            margin-bottom: 6px;
        }
        .menu-card .kategori-tag {
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .menu-card .harga {
            font-size: 18px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 15px;
        }
        .btn-wa {
            background: #25d366;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            width: 100%;
        }
        .btn-wa:hover {
            background: #1ebd56;
        }
    </style>
</head>
<body>

            { nama: "Burger Sosis", kategori: "Burger", harga: 10000 },
            { nama: "Burger Sapi", kategori: "Burger", harga: 10000 },
            { nama: "Burger Telur + Nugget", kategori: "Burger", harga: 12000 },
            { nama: "Burger Telur + Ayam + Nugget", kategori: "Burger", harga: 16000 },

            { nama: "Burger Telur + Ayam + Sosis + Nugget", kategori: "Burger", harga: 20000 },
            { nama: "Burger Telur + Ayam + Sosis + Sapi", kategori: "Burger", harga: 20000 },
            { nama: "Burger Telur + Ayam + Nugget + Sapi", kategori: "Burger", harga: 20000 },
            { nama: "Burger Special", kategori: "Burger", harga: 25000 },

            // ROTI BAKAR BANDUNG
            { nama: "Roti Bakar Isi Daging", kategori: "Roti Bakar", harga: 35000 },
            { nama: "Roti Bakar Special / Komplit", kategori: "Roti Bakar", harga: 20000 },

            // ROTI JOHN
            { nama: "Roti John Special", kategori: "Roti John", harga: 35000 }
        ];

        let kategoriAktif = "Semua";

        function setKategori(kategori, btn) {
            kategoriAktif = kategori;
            document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterMenu();
        }

        function filterMenu() {
            const keyword = document.getElementById("input-cari").value.toLowerCase();
            const container = document.getElementById("container-menu");
            container.innerHTML = "";

            const menuFiltered = daftarMenu.filter(item => {
                const cocokKategori = kategoriAktif === "Semua" || item.kategori === kategoriAktif;
                const cocokCari = item.nama.toLowerCase().includes(keyword);
                return cocokKategori && cocokCari;
            });

            menuFiltered.forEach(item => {
                const card = document.createElement("div");
                card.className = "menu-card";

                const formatRupiah = new Intl.NumberFormat('id-ID', {
                    style: 'currency',
                    currency: 'IDR',
                    minimumFractionDigits: 0
                }).format(item.harga);

                card.innerHTML = `
                    <div>
                        <h3>${item.nama}</h3>
                        <div class="kategori-tag">${item.kategori}</div>
                        <div class="harga">${formatRupiah}</div>
                    </div>
                    <button class="btn-wa" onclick="pesanWA('${item.nama}', '${formatRupiah}')">Pesan via WA</button>
                `;
                container.appendChild(card);
            });
        }

        function pesanWA(menu, harga) {
            const noWa = document.getElementById("pilih-wa").value;
            const pesan = `Halo, saya ingin memesan ${menu} (${harga}). Lokasi pengantaran di Kabanjahe.`;
            window.open(`https://wa.me/${noWa}?text=${encodeURIComponent(pesan)}`, '_blank');
        }

        // Jalankan fungsi filter saat halaman dimuat
        document.addEventListener("DOMContentLoaded", filterMenu);
    </script>
</body>
</html>
